<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#050816" />
    
    <!-- DNS Prefetch & Preconnect for Performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://lbunafpxuskwmsrraqxl.supabase.co" />
    
    <!-- Preconnect Critical Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lbunafpxuskwmsrraqxl.supabase.co" />
    
    <!-- Preload Critical Fonts - James Bond 2028 + Loft-Film Video Fonts -->
    <link 
      rel="preload" 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" 
      as="style" 
      fetchpriority="high"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    
    <!-- Basic Meta Tags (Fallback for Crawlers - wird von React-Helmet pro Route überschrieben) -->
    <title>AdTool AI — One Creator. One Entire Studio.</title>
    <meta name="description" content="Create complete AI videos with the leading models, voices, and lip-sync in one workflow. No film crew needed. Founders deal from €14.99/month." />
    <meta name="author" content="AdTool AI" />
    <meta name="keywords" content="AI video generator, create AI video, AI lip-sync, AI avatar video, AI voiceover, video production without a team, AI ad video, content creator tools" />

    
    <!-- Google Search Console Verification — TODO: setzen, sobald Verifikationscode aus der Search Console vorliegt -->
    <!-- <meta name="google-site-verification" content="" /> -->
    
    <!-- PWA / Manifest -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Security Headers (sollten auch vom Server gesetzt werden) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options must be set as an HTTP header (see public/_headers), not via <meta>. Browsers reject the meta variant. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="AdTool AI — One Creator. One Entire Studio." />
    <meta property="og:description" content="All leading AI models, voices, and precise lip-sync in one seamless workflow. From idea to finished video — no film crew needed." />
    <meta property="og:type" content="website" />
    <!-- Facebook App-ID: verknüpft Website und Meta-App (öffentliche Kennung, kein Secret) -->
    <meta property="fb:app_id" content="1769514810345813" />
    <!-- Kein statisches og:url: Crawler (Meta) folgen dem Tag wie einer Weiterleitung
         und würden sonst jede Unterseite (/privacy, /legal/terms) als Startseite werten. -->

    <meta property="og:image" content="https://useadtool.ai/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="AdTool AI" />
    <meta name="application-name" content="AdTool AI" />
    <meta name="apple-mobile-web-app-title" content="AdTool AI" />

    <!-- Organization: eindeutiger Markenname für automatisierte Prüfungen -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "AdTool AI",
        "url": "https://useadtool.ai/",
        "logo": "https://useadtool.ai/og-home.jpg"
      }
    </script>



    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AdTool AI — One Creator. One Entire Studio." />
    <meta name="twitter:description" content="All leading AI models, voices, and lip-sync in one workflow. From idea to finished video — no film crew needed." />
    <meta name="twitter:image" content="https://useadtool.ai/og-home.jpg" />
    
    <!-- Google Consent Mode v2 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Default consent state
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'analytics_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
      
      gtag('js', new Date());
      
      // GA Measurement ID
      const GA_MEASUREMENT_ID = 'G-VSWEB93JDN';
      if (GA_MEASUREMENT_ID && GA_MEASUREMENT_ID !== '__GA_MEASUREMENT_ID__') {
        gtag('config', GA_MEASUREMENT_ID);
      }
    </script>
    
    <!-- Google Analytics Script (nur nach Consent laden) -->
    <script>
      // GA Script wird nach Consent dynamisch geladen via consent.ts
    </script>
    
    <!-- PostHog is loaded via npm in main.tsx to avoid CORS issues -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
