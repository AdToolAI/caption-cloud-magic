<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#050816" />
    
    <!-- DNS Prefetch & Preconnect for Performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://lbunafpxuskwmsrraqxl.supabase.co" />
    
    <!-- Preconnect Critical Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lbunafpxuskwmsrraqxl.supabase.co" />
    
    <!-- Preload Critical Fonts - James Bond 2028 + Loft-Film Video Fonts -->
    <link 
      rel="preload" 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" 
      as="style" 
      fetchpriority="high"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    
    <!-- Basic Meta Tags (Fallback for Crawlers - wird von React-Helmet pro Route überschrieben) -->
    <title>AdTool AI — Ein Creator. Ein ganzes Studio.</title>
    <meta name="description" content="Erstelle komplette KI-Videos mit den führenden Modellen, Stimmen und Lip-Sync in einem Workflow. Ohne Filmteam. Founders-Deal ab 14,99 €/Monat." />
    <meta name="author" content="AdTool AI" />
    <meta name="keywords" content="KI Videogenerator, KI Video erstellen, Lip-Sync KI, AI Avatar Video, KI Voiceover, Videoproduktion ohne Team, KI Werbevideo, Content Creator Tools" />

    
    <!-- Google Search Console Verification — TODO: setzen, sobald Verifikationscode aus der Search Console vorliegt -->
    <!-- <meta name="google-site-verification" content="" /> -->
    
    <!-- PWA / Manifest -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Security Headers (sollten auch vom Server gesetzt werden) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options must be set as an HTTP header (see public/_headers), not via <meta>. Browsers reject the meta variant. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="AdTool AI — Ein Creator. Ein ganzes Studio." />
    <meta property="og:description" content="Alle führenden KI-Modelle, Stimmen und präziser Lip-Sync in einem durchgängigen Workflow. Von der Idee zum fertigen Video — ohne Filmteam." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://useadtool.ai" />
    <meta property="og:image" content="https://useadtool.ai/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="de_DE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AdTool AI — Ein Creator. Ein ganzes Studio." />
    <meta name="twitter:description" content="Alle führenden KI-Modelle, Stimmen und Lip-Sync in einem Workflow. Von der Idee zum fertigen Video — ohne Filmteam." />
    <meta name="twitter:image" content="https://useadtool.ai/og-home.jpg" />
    
    <!-- Google Consent Mode v2 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Default consent state
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'analytics_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
      
      gtag('js', new Date());
      
      // GA Measurement ID
      const GA_MEASUREMENT_ID = 'G-VSWEB93JDN';
      if (GA_MEASUREMENT_ID && GA_MEASUREMENT_ID !== '__GA_MEASUREMENT_ID__') {
        gtag('config', GA_MEASUREMENT_ID);
      }
    </script>
    
    <!-- Google Analytics Script (nur nach Consent laden) -->
    <script>
      // GA Script wird nach Consent dynamisch geladen via consent.ts
    </script>
    
    <!-- PostHog is loaded via npm in main.tsx to avoid CORS issues -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
